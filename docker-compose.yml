# Локальный PostgreSQL, чтобы разработка шла на той же СУБД, что и прод (Neon).
# Версия совпадает с той, что выбрана в Neon.
#
#   docker compose up -d      поднять
#   docker compose down       остановить (данные останутся в томе)
#   docker compose down -v    остановить и стереть данные
services:
  db:
    image: postgres:18-alpine
    container_name: kazdemeu-db
    environment:
      POSTGRES_DB: kazdemeu
      POSTGRES_USER: kazdemeu
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kazdemeu -d kazdemeu"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
